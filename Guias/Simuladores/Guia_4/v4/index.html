      camera.position.set(...presets.pos);
      controls.target.set(...presets.target);
      controls.update();
    }

    function renderPanel() {
      const m = byId[state.active];
      const q = state.params[state.active];
      els.controls.innerHTML = m.controls.map(([key, label, min, max, step]) => `
        <div class="control">
          <label for="range-${key}">${label}</label>
          <input id="num-${key}" type="number" min="${min}" max="${max}" step="${step}" value="${fmtInput(q[key])}">
          <input id="range-${key}" type="range" min="${min}" max="${max}" step="${step}" value="${fmtInput(q[key])}">
        </div>
      `).join("");
      for (const [key] of m.controls) {
        const range = document.getElementById(`range-${key}`);
        const num = document.getElementById(`num-${key}`);
        const update = value => {
          const parsed = Number(value);
          if (!Number.isFinite(parsed)) return;
          q[key] = parsed;
          range.value = String(parsed);
          num.value = fmtInput(parsed);
          enforceGeometryBounds(key);
          rebuildScene();
        };
        range.addEventListener("input", () => update(range.value));
        num.addEventListener("input", () => update(num.value));
      }
      els.steps.innerHTML = m.steps.map((s, i) => `<div class="step"><b>${i + 1}</b><span>${s}</span></div>`).join("");
      els.formula.innerHTML = m.formula.map(s => `<div>${s}</div>`).join("");
      typeset();
      drawProfile();
      renderMetrics();
    }

    function enforceGeometryBounds(changedKey) {
      if (state.active !== "p6tc") return;
      const q = state.params.p6tc;
      if (q.b <= q.a + 0.08) {
        if (changedKey === "a") q.b = q.a + 0.08;
        else q.a = Math.max(0.25, q.b - 0.08);
        renderPanel();
      }
    }

    function typeset() {
      if (window.MathJax?.typesetPromise) {
        window.MathJax.typesetPromise([els.steps, els.formula]).catch(() => {});
      }
    }

    function renderMetrics() {
      const m = byId[state.active];
      const rows = m.metrics().slice(0, 6);
      els.metrics.innerHTML = rows.map(([label, value]) => `
        <div class="metric"><span>${label}</span><b>${value}</b></div>
      `).join("");
    }

    function rebuildScene() {
      while (sceneRoot.children.length) sceneRoot.remove(sceneRoot.children[0]);
      state.particles = null;
      state.staticTick = () => {};
      byId[state.active].build(sceneRoot);
      drawProfile();
      drawSceneProfile();
      renderMetrics();
    }

    function resize() {
      const rect = els.canvas.getBoundingClientRect();
      const w = Math.max(1, rect.width);
      const h = Math.max(1, rect.height);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    function animate(now = performance.now()) {
      const dt = Math.min(0.045, Math.max(0.001, (now - (state.last || now)) / 1000));
      state.last = now;
      state.time += dt;
      if (state.particles) updateParticles(dt);
      state.staticTick(dt);
      controls.update();
      renderer.render(scene, camera);
      state.frame = requestAnimationFrame(animate);
    }

    function updateParticles(dt) {
      const pack = state.particles;
      pack.update(dt);
      pack.geometry.attributes.position.needsUpdate = true;
      pack.geometry.attributes.color.needsUpdate = true;
    }

    function createParticlePack(count, size, update) {
      const geometry = new THREE.BufferGeometry();
      const pos = new Float32Array(count * 3);
      const col = new Float32Array(count * 3);
      geometry.setAttribute("position", new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
      geometry.setAttribute("color", new THREE.BufferAttribute(col, 3).setUsage(THREE.DynamicDrawUsage));
      const material = new THREE.PointsMaterial({
        size: size * 1.32,
        sizeAttenuation: true,
        vertexColors: true,
        transparent: true,
        opacity: 1,
        depthTest: true,
        depthWrite: false
      });
      const points = new THREE.Points(geometry, material);
      state.particles = { geometry, positions: pos, colors: col, points, update };
      return state.particles;
    }

    function buildP1(root) {
      const q = state.params.p1;
      const d = Math.max(.05, q.d);
      const L = 6.0, W = 3.0;
      const maxAbs = sampleMax(y => Math.abs(uP1(y)), 0, d);
      state.maxSpeed = maxAbs;

      addBox(root, [L, .08, W], [0, 0, 0], 0x74837c, 1);
      addBox(root, [L, .08, W], [0, d, 0], 0x87948d, 1);
      addBox(root, [L, d, W], [0, d / 2, 0], 0x54b5a7, .24);
      addFrameBox(root, L, d, W, [0, d / 2, 0], 0x48615c);
      const tickTopPlate = addMovingBelt(root, d + .075, [-1.1, 0, 1.1], L, q.U, 0x0b7f79);

      for (let i = 0; i <= 7; i++) {
        const y = d * i / 7;
        const u = uP1(y);
        addVelocityArrow(root, [-2.65, y, W / 2 + .38], [Math.sign(u || 1), 0, 0], .18 + .95 * Math.abs(u) / maxAbs, colorForSpeed(Math.abs(u) / maxAbs));
      }

      const data = Array.from({ length: 520 }, () => ({
        x: rand(-L / 2, L / 2),
        y: rand(.06, d - .06),
        z: rand(-W / 2 + .06, W / 2 - .06)
      }));
      const pack = createParticlePack(data.length, .045, dt => {
        const speed = q.speed * .52;
        for (let i = 0; i < data.length; i++) {
          const p = data[i];
          const u = uP1(p.y);
          p.x += u * speed * dt;
          p.x = wrap(p.x, -L / 2, L / 2);
          writeParticle(pack, i, p.x, p.y, p.z, Math.abs(u) / maxAbs);
        }
      });
      root.add(pack.points);
      state.profileData = profileP1();
      state.staticTick = dt => tickTopPlate(dt * q.speed);
    }

    function buildP2(root) {
      const q = state.params.p2;
      const theta = THREE.MathUtils.degToRad(q.theta);
      const d = Math.max(.05, q.d);
      const L = 6.0, W = 3.0;
      const maxAbs = Math.max(.01, uFilm(d));
      state.maxSpeed = maxAbs;

      const film = new THREE.Group();
      film.rotation.z = -theta;
      root.add(film);
      addBox(film, [L, .08, W], [0, -.05, 0], 0xaeb7b1, .96);
      addBox(film, [L, d, W], [0, d / 2, 0], 0x67bca9, .22);
      addFrameBox(film, L, d, W, [0, d / 2, 0], 0x536963);
      const tickSurface = addMovingBelt(film, d + .045, [-1.05, 0, 1.05], L, uFilm(d), 0x087f79);

      for (let i = 0; i <= 7; i++) {
        const y = d * i / 7;
        const u = uFilm(y);
        addVelocityArrow(film, [-2.65, y, W / 2 + .38], [1, 0, 0], .12 + .95 * u / maxAbs, colorForSpeed(u / maxAbs));
      }
      addVelocityArrow(root, [2.7, 2.1, 0], [0, -1, 0], .8, 0x6d7480);

      const data = Array.from({ length: 520 }, () => ({
        x: rand(-L / 2, L / 2),
        y: rand(.045, d - .035),
        z: rand(-W / 2 + .06, W / 2 - .06)
      }));
      const pack = createParticlePack(data.length, .045, dt => {
        const speed = q.speed * .36;
        for (let i = 0; i < data.length; i++) {
          const p = data[i];
          const u = uFilm(p.y);
          p.x += u * speed * dt;
          p.x = wrap(p.x, -L / 2, L / 2);
          const v = new THREE.Vector3(p.x, p.y, p.z).applyEuler(film.rotation);
          writeParticle(pack, i, v.x, v.y, v.z, u / maxAbs);
        }
      });
      root.add(pack.points);
      state.profileData = profileP2();
      state.staticTick = dt => tickSurface(dt * q.speed * .36);
    }

    function buildP4(root) {
      const q = state.params.p4;
      const a = Math.max(.05, q.a);
      const L = 6.2;
      const maxAbs = Math.max(.01, uPipe(0));
      state.maxSpeed = maxAbs;
      const wallMat = new THREE.MeshStandardMaterial({
        color: 0x7bc4b6,
        transparent: true,
        opacity: .18,
        roughness: .65,
        metalness: .03,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const tube = new THREE.Mesh(new THREE.CylinderGeometry(a, a, L, 80, 1, true), wallMat);
      tube.rotation.z = Math.PI / 2;
      root.add(tube);
      addTubeRings(root, a, L);

      for (let i = 0; i <= 6; i++) {
        const r = a * i / 6;
        const u = uPipe(r);
        addVelocityArrow(root, [-2.9, r, a + .35], [1, 0, 0], .13 + .95 * u / maxAbs, colorForSpeed(u / maxAbs));
        if (i > 0) addVelocityArrow(root, [-2.9, -r, a + .35], [1, 0, 0], .13 + .95 * u / maxAbs, colorForSpeed(u / maxAbs));
      }

      const data = Array.from({ length: 620 }, () => {
        const rr = a * Math.sqrt(Math.random());
        const th = rand(0, Math.PI * 2);
        return { x: rand(-L / 2, L / 2), y: rr * Math.cos(th), z: rr * Math.sin(th) };
      });
      const pack = createParticlePack(data.length, .045, dt => {
        const speed = q.speed * .55;
        for (let i = 0; i < data.length; i++) {
          const p = data[i];
          const r = Math.hypot(p.y, p.z);
          const u = uPipe(r);
          p.x += u * speed * dt;
          p.x = wrap(p.x, -L / 2, L / 2);
          writeParticle(pack, i, p.x, p.y, p.z, u / maxAbs);
        }
      });
      root.add(pack.points);
      state.profileData = profileP4();
      state.staticTick = () => {};
    }

    function buildP6TC(root) {
      const q = state.params.p6tc;
      if (q.b <= q.a + .08) q.b = q.a + .08;
      const a = Math.max(.05, q.a);
      const b = Math.max(a + .08, q.b);
      const h = q.height;
      const maxAbs = sampleMax(r => Math.abs(vTheta(r)), a, b);
      state.maxSpeed = maxAbs;

      const outer = new THREE.Mesh(
        new THREE.CylinderGeometry(b, b, h, 96, 1, true),
        new THREE.MeshStandardMaterial({
          color: 0x8ccbc0,
          transparent: true,
          opacity: .14,
          roughness: .55,
          side: THREE.DoubleSide,
          depthWrite: false
        })
      );
      outer.position.y = h / 2;
      root.add(outer);

      const inner = new THREE.Mesh(
        new THREE.CylinderGeometry(a, a, h, 96, 1, false),
        new THREE.MeshStandardMaterial({ color: 0xf4f6f2, roughness: .62, metalness: .04 })
      );
      inner.position.y = h / 2;
      root.add(inner);
      const innerMarker = addRotatingCylinderMarkers(root, a + .018, h, 0x174f9a, 4, .06);
      const outerMarker = addRotatingCylinderMarkers(root, b + .018, h, 0x087f79, 5, .045);

      addCylinderEdges(root, a, h, 0x2e3d39, .85);
      addCylinderEdges(root, b, h, 0x2e3d39, .55);
      addTCBands(root, a, b, h, maxAbs);

      const unstable = rayleighUnstable();
      if (unstable) addVortexCells(root, a, b, h);

      const data = Array.from({ length: 780 }, () => ({
        r: Math.sqrt(rand(a * a, b * b)),
        th: rand(0, Math.PI * 2),
        y: rand(.04, h - .04),
        phase: rand(0, Math.PI * 2)
      }));
      const pack = createParticlePack(data.length, .04, dt => {
        const speed = q.speed * .72;
        for (let i = 0; i < data.length; i++) {
          const p = data[i];
          const vt = vTheta(p.r);
          const omega = vt / Math.max(.04, p.r);
          p.th += omega * speed * dt;
          if (unstable) {
            p.y += 0.18 * speed * dt * Math.sin(4 * Math.PI * p.y / h + p.phase + state.time);
            p.y = wrap(p.y, .04, h - .04);
            p.r += 0.035 * speed * dt * Math.sin(4 * Math.PI * p.y / h + p.th);
            p.r = clamp(p.r, a + .025, b - .025);
          }
          const x = p.r * Math.cos(p.th);
          const z = p.r * Math.sin(p.th);
          writeParticle(pack, i, x, p.y, z, Math.abs(vt) / maxAbs);
        }
      });
      root.add(pack.points);
      state.profileData = profileP6TC();
      state.staticTick = dt => {
        inner.rotation.y += q.omega1 * dt * q.speed * .25;
        outer.rotation.y += q.omega2 * dt * q.speed * .16;
        innerMarker.rotation.y += q.omega1 * dt * q.speed * .25;
        outerMarker.rotation.y += q.omega2 * dt * q.speed * .16;
      };
    }

    function buildP7(root) {
      const q = state.params.p7;
      const R = Math.max(.05, q.D / 2);
      const L = 7.2, W = 4.0, H = 3.4;
      const maxAbs = Math.max(.1, q.U * 1.55);
      state.maxSpeed = maxAbs;

      const sphere = new THREE.Mesh(
        new THREE.SphereGeometry(R, 64, 32),
        new THREE.MeshStandardMaterial({ color: 0xf4f5ee, roughness: .55, metalness: .05 })
      );
      root.add(sphere);
      root.add(new THREE.LineSegments(
        new THREE.WireframeGeometry(new THREE.SphereGeometry(R * 1.01, 24, 12)),
        new THREE.LineBasicMaterial({ color: 0x97aaa2, transparent: true, opacity: .45 })
      ));
      addVelocityArrow(root, [-3.2, 1.35, 0], [1, 0, 0], 1.05, 0x087f79);

      addSphereStreamlines(root, R, q.U, L);

      const data = Array.from({ length: 720 }, () => randomWakeParticle(L, W, H, R));
      const pack = createParticlePack(data.length, .052, dt => {
        const speed = q.speed * .58;
        for (let i = 0; i < data.length; i++) {
          const p = data[i];
          const v = sphereVelocity(p.x, p.y, p.z, R, q.U);
          p.x += v.x * speed * dt;
          p.y += v.y * speed * dt;
          p.z += v.z * speed * dt;
          const rr = Math.hypot(p.x, p.y, p.z);
          if (rr < R * 1.06) {
            const s = R * 1.08 / Math.max(.001, rr);
            p.x *= s; p.y *= s; p.z *= s;
          }
          if (p.x > L / 2) Object.assign(p, randomWakeParticle(L, W, H, R, true));
          if (Math.abs(p.y) > H / 2 || Math.abs(p.z) > W / 2) Object.assign(p, randomWakeParticle(L, W, H, R, true));
          const mag = Math.hypot(v.x, v.y, v.z);
          writeParticle(pack, i, p.x, p.y, p.z, mag / maxAbs);
        }
      });
      root.add(pack.points);
      state.profileData = profileP7();
      state.staticTick = () => {};
    }

    function buildP3(root) {
      const q = state.params.p3;
      const theta = THREE.MathUtils.degToRad(q.theta);
      const h1 = Math.max(.04, q.h1), h2 = Math.max(.04, q.h2);
      const D = h1 + h2, L = 6, W = 3;
      const maxAbs = sampleMax(y => Math.abs(uTwoFilm(y)), 0, D);
      const film = new THREE.Group();
      film.rotation.z = -theta;
      root.add(film);
      addBox(film, [L, .08, W], [0, -.05, 0], 0x9ca8a1, 1);
      addBox(film, [L, h1, W], [0, h1 / 2, 0], 0x57b7aa, .26);
      addBox(film, [L, h2, W], [0, h1 + h2 / 2, 0], 0x80c8a6, .25);
      addFrameBox(film, L, D, W, [0, D / 2, 0], 0x536963);
      addInterfaceLine(film, h1, L, W, 0x2f6f83);
      const tickSurface = addMovingBelt(film, D + .045, [-1.05, 0, 1.05], L, uTwoFilm(D), 0x087f79);
      const data = Array.from({ length: 640 }, () => ({ x: rand(-L / 2, L / 2), y: rand(.04, D - .035), z: rand(-W / 2 + .06, W / 2 - .06) }));
      const pack = createParticlePack(data.length, .047, dt => {
        const speed = q.speed * .34;
        for (let i = 0; i < data.length; i++) {
          const p = data[i], u = uTwoFilm(p.y);
          p.x = wrap(p.x + u * speed * dt, -L / 2, L / 2);
          const v = new THREE.Vector3(p.x, p.y, p.z).applyEuler(film.rotation);
          writeParticle(pack, i, v.x, v.y, v.z, Math.abs(u) / maxAbs);
        }
      });
      root.add(pack.points);
      state.staticTick = dt => tickSurface(dt * q.speed * .34);
    }

    function buildP5(root) {
      const q = state.params.p5;
      const a = Math.max(.05, q.a), L = 3.9;
      const mu = Math.max(.001, q.rho * q.nu);
      const baseVis = clamp(a * .36, .23, .62);
      const cases = [
        { f: .62, z: -1.45, color: 0x315f95 },
        { f: 1.00, z: 0, color: 0x087f79 },
        { f: 1.38, z: 1.45, color: 0xc08a2a }
      ].map(c => ({
        ...c,
        visR: baseVis * c.f,
        physR: a * c.f,
        qRel: c.f ** 4
      }));
      const maxAbs = Math.max(.01, ...cases.map(c => q.G / (4 * mu) * c.physR * c.physR));

      for (const c of cases) {
        const mat = new THREE.MeshStandardMaterial({
          color: 0x7bc4b6,
          transparent: true,
          opacity: c.f === 1 ? .22 : .14,
          roughness: .65,
          side: THREE.DoubleSide,
          depthWrite: false
        });
        const tube = new THREE.Mesh(new THREE.CylinderGeometry(c.visR, c.visR, L, 72, 1, true), mat);
        tube.rotation.z = Math.PI / 2;
        tube.position.z = c.z;
        root.add(tube);
        addTubeRingsAt(root, c.visR, L, c.z, c.f === 1 ? .82 : .55);
        addVelocityArrow(root, [-2.45, c.visR + .18, c.z], [1, 0, 0], .35 + .55 * c.f * c.f, c.color);
        const barLen = .22 + .55 * c.qRel;
        addBox(root, [barLen, .16, .18], [2.25 + barLen / 2, -c.visR - .38, c.z], c.color, .92);
      }

      const data = [];
      for (const c of cases) {
        const n = Math.round(190 * (0.75 + c.f));
        for (let i = 0; i < n; i++) {
          const rr = c.visR * Math.sqrt(Math.random()), th = rand(0, Math.PI * 2);
          data.push({ c, x: rand(-L / 2, L / 2), rr, th });
        }
      }

      const pack = createParticlePack(data.length, .046, dt => {
        const speed = q.speed * .42;
        for (let i = 0; i < data.length; i++) {
          const p = data[i];
          const radialRatio = p.rr / Math.max(.001, p.c.visR);
          const rPhys = p.c.physR * radialRatio;
          const u = Math.max(0, q.G / (4 * mu) * (p.c.physR * p.c.physR - rPhys * rPhys));
          p.x = wrap(p.x + u * speed * dt, -L / 2, L / 2);
          writeParticle(pack, i, p.x, p.rr * Math.cos(p.th), p.c.z + p.rr * Math.sin(p.th), u / maxAbs);
        }
      });
      root.add(pack.points);
      state.staticTick = () => {};
    }

    function buildP6I(root) {
      const q = state.params.p6i;
      const d = Math.max(.05, q.d), L = 6, W = 3;
      const maxAbs = sampleMax(y => Math.abs(uCP(q, y)), 0, d);
      addBox(root, [L, .08, W], [0, 0, 0], 0x74837c, 1);
      addBox(root, [L, .08, W], [0, d, 0], 0x87948d, 1);
      addBox(root, [L, d, W], [0, d / 2, 0], 0x54b5a7, .24);
      addFrameBox(root, L, d, W, [0, d / 2, 0], 0x48615c);
      const tickTopPlate = addMovingBelt(root, d + .075, [-1.1, 0, 1.1], L, q.U, 0x0b7f79);
      const y0 = clamp(d / 2 + Math.max(.001, q.mu) * q.U / (Math.abs(q.G) < 1e-6 ? 1e-6 : q.G * d), 0, d);
      addVelocityArrow(root, [2.45, y0, W / 2 + .42], [1, 0, 0], .55, 0xc08a2a);
      const data = Array.from({ length: 520 }, () => ({ x: rand(-L / 2, L / 2), y: rand(.06, d - .06), z: rand(-W / 2 + .06, W / 2 - .06) }));
      const pack = createParticlePack(data.length, .047, dt => {
        const speed = q.speed * .52;
        for (let i = 0; i < data.length; i++) {
          const p = data[i], u = uCP(q, p.y);
          p.x = wrap(p.x + u * speed * dt, -L / 2, L / 2);
          writeParticle(pack, i, p.x, p.y, p.z, Math.abs(u) / maxAbs);
        }
      });
      root.add(pack.points);
      state.staticTick = dt => tickTopPlate(dt * q.speed);
    }

    function buildP6II(root) {
      const q = state.params.p6ii;
      const theta = THREE.MathUtils.degToRad(q.theta);
      const d = Math.max(.05, q.d), L = 6, W = 3;
      const maxAbs = sampleMax(y => Math.abs(uP6II(y)), 0, d);
      const film = new THREE.Group();
      film.rotation.z = -theta;
      root.add(film);
      addBox(film, [L, .08, W], [0, -.05, 0], 0x9ca8a1, 1);
      addBox(film, [L, d, W], [0, d / 2, 0], 0x67bca9, .23);
      addFrameBox(film, L, d, W, [0, d / 2, 0], 0x536963);
      const tickWall = addMovingBelt(film, -.11, [-1.05, 0, 1.05], L, -q.U, 0x9b3f34);
      const data = Array.from({ length: 540 }, () => ({ x: rand(-L / 2, L / 2), y: rand(.045, d - .035), z: rand(-W / 2 + .06, W / 2 - .06) }));
      const pack = createParticlePack(data.length, .047, dt => {
        const speed = q.speed * .35;
        for (let i = 0; i < data.length; i++) {
          const p = data[i], u = uP6II(p.y);
          p.x = wrap(p.x + u * speed * dt, -L / 2, L / 2);
          const v = new THREE.Vector3(p.x, p.y, p.z).applyEuler(film.rotation);
          writeParticle(pack, i, v.x, v.y, v.z, Math.abs(u) / maxAbs);
        }
      });
      root.add(pack.points);
      state.staticTick = dt => tickWall(dt * q.speed);
    }

    function buildP6III(root) {
      const q = state.params.p6iii;
      if (q.b <= q.a + .08) q.b = q.a + .08;
      const a = Math.max(.05, q.a), b = Math.max(a + .08, q.b), L = 6.2;
      const maxAbs = sampleMax(r => Math.abs(uAnnular(r)), a, b);
      const outer = new THREE.Mesh(new THREE.CylinderGeometry(b, b, L, 96, 1, true), new THREE.MeshStandardMaterial({ color: 0x8ccbc0, transparent: true, opacity: .16, roughness: .6, side: THREE.DoubleSide, depthWrite: false }));
      outer.rotation.z = Math.PI / 2;
      root.add(outer);
      const inner = new THREE.Mesh(new THREE.CylinderGeometry(a, a, L, 96, 1, false), new THREE.MeshStandardMaterial({ color: 0xf4f6f2, roughness: .62 }));
      inner.rotation.z = Math.PI / 2;
      root.add(inner);
      addTubeRings(root, a, L); addTubeRings(root, b, L);
      addVelocityArrow(root, [-2.8, b + .45, 0], [Math.sign(q.U1 || 1), 0, 0], .35 + .6 * Math.abs(q.U1) / Math.max(.1, maxAbs), 0x315f95);
      addVelocityArrow(root, [-2.8, -b - .45, 0], [Math.sign(q.U2 || 1), 0, 0], .35 + .6 * Math.abs(q.U2) / Math.max(.1, maxAbs), 0x087f79);
      const data = Array.from({ length: 650 }, () => {
        const rr = Math.sqrt(rand(a * a, b * b)), th = rand(0, Math.PI * 2);
        return { x: rand(-L / 2, L / 2), y: rr * Math.cos(th), z: rr * Math.sin(th) };
      });
      const pack = createParticlePack(data.length, .047, dt => {
        const speed = q.speed * .55;
        for (let i = 0; i < data.length; i++) {
          const p = data[i], r = Math.hypot(p.y, p.z), u = uAnnular(r);
          p.x = wrap(p.x + u * speed * dt, -L / 2, L / 2);
          writeParticle(pack, i, p.x, p.y, p.z, Math.abs(u) / maxAbs);
        }
      });
      root.add(pack.points);
      state.staticTick = () => {};
    }

    function buildP8(root) {
      const q = state.params.p8, L = 6, W = 3, H = q.ymax;
      const maxAbs = Math.max(.1, q.U);
      addBox(root, [L, .08, W], [0, 0, 0], 0x74837c, 1);
      addBox(root, [L, H, W], [0, H / 2, 0], 0x67bca9, .16);
      addFrameBox(root, L, H, W, [0, H / 2, 0], 0x536963);
      addDiffusionSheet(root, 2 * Math.sqrt(q.nu * q.t), L, W, 0xc08a2a);
      const tickPlate = addMovingBelt(root, .075, [-1.1, 0, 1.1], L, q.U, 0x0b7f79);
      const data = Array.from({ length: 620 }, () => ({ x: rand(-L / 2, L / 2), y: rand(.04, H - .04), z: rand(-W / 2 + .06, W / 2 - .06) }));
      const pack = createParticlePack(data.length, .047, dt => {
        const speed = q.speed * .55;
        for (let i = 0; i < data.length; i++) {
          const p = data[i], u = uStokes1(p.y);
          p.x = wrap(p.x + u * speed * dt, -L / 2, L / 2);
          writeParticle(pack, i, p.x, p.y, p.z, u / maxAbs);
        }
      });
      root.add(pack.points);
      state.staticTick = dt => tickPlate(dt * q.speed);
    }

    function buildP9(root) {
      const q = state.params.p9, R = 3.0, core = Math.sqrt(4 * q.nu * q.t);
      addDisk(root, core, .025, 0x67bca9, .22, .02);
      for (let r = core; r <= R; r += .45) addCircleLine(root, r, 0, 0x8aa39a, .42);
      const maxAbs = sampleMax(r => Math.abs(vVortex(r)), .04, R);
      const data = Array.from({ length: 720 }, () => ({ r: R * Math.sqrt(Math.random()), th: rand(0, Math.PI * 2), y: rand(-.04, .04) }));
      const pack = createParticlePack(data.length, .048, dt => {
        const speed = q.speed * .75;
        for (let i = 0; i < data.length; i++) {
          const p = data[i], vt = vVortex(Math.max(.035, p.r));
          p.th += vt / Math.max(.04, p.r) * speed * dt;
          writeParticle(pack, i, p.r * Math.cos(p.th), p.y, p.r * Math.sin(p.th), Math.abs(vt) / maxAbs);
        }
      });
      root.add(pack.points);
      state.staticTick = () => {};
    }

    function buildP10(root) {
      const q = state.params.p10, L = 6, W = 3, H = q.ymax;
      addBox(root, [L, .08, W], [0, 0, 0], 0x74837c, 1);
      addBox(root, [L, H, W], [0, H / 2, 0], 0x67bca9, .14);
      addFrameBox(root, L, H, W, [0, H / 2, 0], 0x536963);
      const wave = addOscillatingSheet(root, L, W, H);
      const tickPlate = addMovingBelt(root, .075, [-1.1, 0, 1.1], L, q.U0, 0x0b7f79);
      const data = Array.from({ length: 620 }, () => ({ x: rand(-L / 2, L / 2), y: rand(.04, H - .04), z: rand(-W / 2 + .06, W / 2 - .06) }));
      const pack = createParticlePack(data.length, .047, dt => {
        const maxAbs = Math.max(.1, q.U0);
        const speed = q.speed * .45;
        for (let i = 0; i < data.length; i++) {
          const p = data[i], u = uOscillating(p.y, state.time);
          p.x = wrap(p.x + u * speed * dt, -L / 2, L / 2);
          writeParticle(pack, i, p.x, p.y, p.z, Math.abs(u) / maxAbs);
        }
      });
      root.add(pack.points);
      state.staticTick = dt => { tickPlate(dt * q.speed * Math.cos(q.omega * state.time)); wave.rotation.y = .03 * Math.sin(q.omega * state.time); };
    }

    function buildP11(root) {
      const q = state.params.p11, h = q.h, L = 6, W = 3;
      const maxAbs = Math.max(.1, q.U);
      addBox(root, [L, .08, W], [0, 0, 0], 0x74837c, 1);
      addBox(root, [L, .08, W], [0, h, 0], 0x87948d, 1);
      addBox(root, [L, h, W], [0, h / 2, 0], 0x67bca9, .18);
      addFrameBox(root, L, h, W, [0, h / 2, 0], 0x536963);
      const tickPlate = addMovingBelt(root, .075, [-1.1, 0, 1.1], L, q.U, 0x0b7f79);
      const data = Array.from({ length: 620 }, () => ({ x: rand(-L / 2, L / 2), y: rand(.04, h - .04), z: rand(-W / 2 + .06, W / 2 - .06) }));
      const pack = createParticlePack(data.length, .047, dt => {
        const speed = q.speed * .55;
        for (let i = 0; i < data.length; i++) {
          const p = data[i], u = uFiniteStart(p.y);
          p.x = wrap(p.x + u * speed * dt, -L / 2, L / 2);
          writeParticle(pack, i, p.x, p.y, p.z, Math.abs(u) / maxAbs);
        }
      });
      root.add(pack.points);
      state.staticTick = dt => tickPlate(dt * q.speed);
    }

    function buildP12(root) {
      const q = state.params.p12, L = q.xmax, W = 3, H = 2.4;
      addBox(root, [L, .06, W], [0, 0, 0], 0x74837c, 1);
      addBoundaryLayerSurface(root, L, W);
      addVelocityArrow(root, [-L / 2 - .35, 1.2, 0], [1, 0, 0], 1.0, 0x087f79);
      const data = Array.from({ length: 700 }, () => ({ x: rand(-L / 2, L / 2), y: rand(.04, H), z: rand(-W / 2, W / 2) }));
      const pack = createParticlePack(data.length, .047, dt => {
        const speed = q.speed * .55;
        for (let i = 0; i < data.length; i++) {
          const p = data[i], xphys = Math.max(.05, p.x + L / 2 + .05), eta = p.y * Math.sqrt(q.U / Math.max(.001, q.nu * xphys));
          const vx = q.U * blasiusFp(eta);
          p.x += vx * speed * dt;
          if (p.x > L / 2) { p.x = -L / 2; p.y = rand(.04, H); p.z = rand(-W / 2, W / 2); }
          writeParticle(pack, i, p.x, p.y, p.z, vx / Math.max(.1, q.U));
        }
      });
      root.add(pack.points);
      state.staticTick = () => {};
    }

    function buildP13(root) {
      const q = state.params.p13, R = q.R, H = Math.max(.6, 4 * Math.sqrt(q.nu / Math.max(.001, q.Omega)));
      const disk = addDisk(root, R, .08, 0x8f9c95, 1, 0);
      addDisk(root, R, H, 0x67bca9, .13, H / 2);
      const marker = addRotatingDiskMarker(root, R);
      const data = Array.from({ length: 650 }, () => ({ r: R * Math.sqrt(Math.random()), th: rand(0, Math.PI * 2), y: rand(.04, H) }));
      const pack = createParticlePack(data.length, .047, dt => {
        const speed = q.speed;
        const maxAbs = Math.max(.1, q.Omega * R);
        for (let i = 0; i < data.length; i++) {
          const p = data[i], vt = diskVtheta(p.r, p.y);
          p.th -= vt / Math.max(.04, p.r) * speed * dt;
          writeParticle(pack, i, p.r * Math.cos(p.th), p.y, p.r * Math.sin(p.th), Math.abs(vt) / maxAbs);
        }
      });
      root.add(pack.points);
      state.staticTick = dt => { disk.rotation.y -= q.Omega * q.speed * dt * .3; marker.rotation.y -= q.Omega * q.speed * dt * .3; };
    }

    function addTCBands(root, a, b, h, maxAbs) {
      const q = state.params.p6tc;
      const unstable = rayleighUnstable();
      const layers = 44;
      const r = a + .62 * (b - a);
      for (let i = 0; i < layers; i++) {
        const y = h * (i + .5) / layers;
        const base = Math.abs(vTheta(r)) / maxAbs;
        const band = unstable ? .22 * (1 + Math.sin(i * .92 + q.omega1 * .35)) : .06 * (1 + Math.sin(i * .7));
        const t = clamp(base * .75 + band, 0, 1);
        const mesh = new THREE.Mesh(
          new THREE.CylinderGeometry(r, r, h / layers * .86, 96, 1, true),
          new THREE.MeshStandardMaterial({
            color: colorForSpeed(t),
            transparent: true,
            opacity: .42,
            side: THREE.DoubleSide,
            roughness: .6,
            depthWrite: false
          })
        );
        mesh.position.y = y;
        root.add(mesh);
      }
    }

    function addVortexCells(root, a, b, h) {
      const mat = new THREE.LineBasicMaterial({ color: 0x087f79, transparent: true, opacity: .68 });
      const cells = Math.max(3, Math.round(h / Math.max(.35, (b - a) * .82)));
      const r = (a + b) / 2;
      for (let c = 0; c < cells; c++) {
        const y0 = h * (c + .5) / cells;
        const pts = [];
        for (let i = 0; i <= 180; i++) {
          const th = i / 180 * Math.PI * 2;
          const yy = y0 + Math.sin(th) * h / cells * .28;
          const rr = r + Math.cos(th) * (b - a) * .23;
          pts.push(new THREE.Vector3(rr * Math.cos(th * 1.8), yy, rr * Math.sin(th * 1.8)));
        }
        root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
      }
    }

    function addTubeRings(root, a, L) {
      const mat = new THREE.LineBasicMaterial({ color: 0x2e3d39, transparent: true, opacity: .7 });
      for (const x of [-L / 2, L / 2]) {
        const pts = [];
        for (let i = 0; i <= 128; i++) {
          const th = i / 128 * Math.PI * 2;
          pts.push(new THREE.Vector3(x, a * Math.cos(th), a * Math.sin(th)));
        }
        root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
      }
      for (let k = 0; k < 4; k++) {
        const th = k * Math.PI / 2;
        const pts = [new THREE.Vector3(-L / 2, a * Math.cos(th), a * Math.sin(th)), new THREE.Vector3(L / 2, a * Math.cos(th), a * Math.sin(th))];
        root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
      }
    }

    function addTubeRingsAt(root, a, L, z0, opacity) {
      const mat = new THREE.LineBasicMaterial({ color: 0x2e3d39, transparent: true, opacity });
      for (const x of [-L / 2, L / 2]) {
        const pts = [];
        for (let i = 0; i <= 128; i++) {
          const th = i / 128 * Math.PI * 2;
          pts.push(new THREE.Vector3(x, a * Math.cos(th), z0 + a * Math.sin(th)));
        }
        root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
      }
      for (let k = 0; k < 4; k++) {
        const th = k * Math.PI / 2;
        const pts = [new THREE.Vector3(-L / 2, a * Math.cos(th), z0 + a * Math.sin(th)), new THREE.Vector3(L / 2, a * Math.cos(th), z0 + a * Math.sin(th))];
        root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
      }
    }

    function addCylinderEdges(root, r, h, color, opacity) {
      const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity });
      for (const y of [0, h]) {
        const pts = [];
        for (let i = 0; i <= 128; i++) {
          const th = i / 128 * Math.PI * 2;
          pts.push(new THREE.Vector3(r * Math.cos(th), y, r * Math.sin(th)));
        }
        root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
      }
      for (let k = 0; k < 4; k++) {
        const th = k * Math.PI / 2;
        const pts = [new THREE.Vector3(r * Math.cos(th), 0, r * Math.sin(th)), new THREE.Vector3(r * Math.cos(th), h, r * Math.sin(th))];
        root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
      }
    }

    function addBox(root, size, pos, color, opacity) {
      const mat = new THREE.MeshStandardMaterial({
        color,
        transparent: opacity < 1,
        opacity,
        roughness: .72,
        metalness: .03,
        side: THREE.DoubleSide,
        depthWrite: opacity >= .5
      });
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(...size), mat);
      mesh.position.set(...pos);
      root.add(mesh);
      return mesh;
    }

    function addFrameBox(root, L, H, W, center, color) {
      const x = L / 2, y = H / 2, z = W / 2;
      const corners = [
        [-x,-y,-z],[x,-y,-z],[x,y,-z],[-x,y,-z],
        [-x,-y,z],[x,-y,z],[x,y,z],[-x,y,z]
      ].map(p => new THREE.Vector3(p[0] + center[0], p[1] + center[1], p[2] + center[2]));
      const idx = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
      const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: .58 });
      for (const [a, b] of idx) root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([corners[a], corners[b]]), mat));
    }

    function addVelocityArrow(root, origin, direction, length, color) {
      const dir = new THREE.Vector3(...direction);
      if (dir.lengthSq() < 1e-8) dir.set(1, 0, 0);
      dir.normalize();
      const arrow = new THREE.ArrowHelper(dir, new THREE.Vector3(...origin), length, color, Math.min(.16, length * .28), Math.min(.1, length * .18));
      root.add(arrow);
    }

    function addSceneProfile(root, id) {
      const mod = byId[id];
      if (!mod?.profile) return;
      const data = mod.profile().filter(p => Number.isFinite(p.x) && Number.isFinite(p.y));
      if (data.length < 2) return;

      const cfg = sceneProfileConfig(id);
      const group = new THREE.Group();
      group.position.set(...cfg.pos);
      group.rotation.set(...cfg.rot);
      group.scale.setScalar(cfg.scale);

      const w = 1.25, h = .95;
      const xs = data.map(p => p.x), ys = data.map(p => p.y);
      const xmin = Math.min(...xs), xmax = Math.max(...xs);
      const ymin = Math.min(...ys), ymax = Math.max(...ys);
      const sx = x => .12 + (x - xmin) / Math.max(1e-8, xmax - xmin) * (w - .22);
      const sy = y => .12 + (y - ymin) / Math.max(1e-8, ymax - ymin) * (h - .22);

      const bg = new THREE.Mesh(
        new THREE.PlaneGeometry(w, h),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: .78, side: THREE.DoubleSide, depthWrite: false })
      );
      bg.position.set(w / 2, h / 2, -.012);
      group.add(bg);

      const axisMat = new THREE.LineBasicMaterial({ color: 0x8aa39a, transparent: true, opacity: .82 });
      const curveMat = new THREE.LineBasicMaterial({ color: 0x087f79, transparent: true, opacity: .96 });
      const barMat = new THREE.LineBasicMaterial({ color: 0x315f95, transparent: true, opacity: .55 });

      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(.1, .1, 0), new THREE.Vector3(w - .06, .1, 0)
      ]), axisMat));
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(.1, .1, 0), new THREE.Vector3(.1, h - .06, 0)
      ]), axisMat));

      if (xmin < 0 && xmax > 0) {
        const zx = sx(0);
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(zx, .1, .004), new THREE.Vector3(zx, h - .06, .004)
        ]), new THREE.LineBasicMaterial({ color: 0xc08a2a, transparent: true, opacity: .65 })));
      }

      const zeroX = xmin < 0 && xmax > 0 ? sx(0) : sx(xmin);
      for (let i = 0; i <= 6; i++) {
        const p = data[Math.round(i * (data.length - 1) / 6)];
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(zeroX, sy(p.y), .006),
          new THREE.Vector3(sx(p.x), sy(p.y), .006)
        ]), barMat));
      }

      const pts = data.map(p => new THREE.Vector3(sx(p.x), sy(p.y), .01));
      group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), curveMat));
      root.add(group);
    }

    function sceneProfileConfig(id) {
      const base = { pos: [-2.9, .16, -2.05], rot: [0, 0, 0], scale: 1 };
      return {
        p1: base,
        p2: { pos: [-2.9, .25, -2.05], rot: [0, 0, 0], scale: 1 },
        p3: { pos: [-2.9, .25, -2.05], rot: [0, 0, 0], scale: 1 },
        p4: { pos: [-2.75, -1.28, -2.05], rot: [0, 0, 0], scale: 1 },
        p5: { pos: [-2.75, -1.28, -2.05], rot: [0, 0, 0], scale: 1 },
        p6i: base,
        p6ii: { pos: [-2.9, .25, -2.05], rot: [0, 0, 0], scale: 1 },
        p6iii: { pos: [-2.75, -1.28, -2.05], rot: [0, 0, 0], scale: 1 },
        p6tc: { pos: [-2.25, .15, -2.15], rot: [0, 0, 0], scale: 1.05 },
        p7: { pos: [-2.95, -1.25, -2.0], rot: [0, 0, 0], scale: 1 },
        p8: { pos: [-2.9, .2, -2.05], rot: [0, 0, 0], scale: 1 },
        p9: { pos: [-2.1, .08, -2.25], rot: [0, 0, 0], scale: 1.05 },
        p10: { pos: [-2.9, .2, -2.05], rot: [0, 0, 0], scale: 1 },
        p11: { pos: [-2.9, .16, -2.05], rot: [0, 0, 0], scale: 1 },
        p12: { pos: [-2.95, .2, -2.05], rot: [0, 0, 0], scale: 1 },
        p13: { pos: [-2.1, .1, -2.15], rot: [0, 0, 0], scale: 1.05 }
      }[id] || base;
    }

    function addMovingBelt(root, y, zValues, L, U, color) {
      const group = new THREE.Group();
      const markers = [];
      const mat = new THREE.MeshStandardMaterial({ color, roughness: .45, metalness: .05 });
      for (const z of zValues) {
        for (let i = 0; i < 9; i++) {
          const mesh = new THREE.Mesh(new THREE.BoxGeometry(.34, .035, .055), mat);
          mesh.position.set(-L / 2 + i * L / 8, y, z);
          mesh.userData.x = mesh.position.x;
          group.add(mesh);
          markers.push(mesh);
        }
      }
      root.add(group);
      return dt => {
        const ux = Number.isFinite(U) ? U : 0;
        for (const mesh of markers) {
          mesh.userData.x = wrap(mesh.userData.x + ux * dt * .55, -L / 2, L / 2);
          mesh.position.x = mesh.userData.x;
        }
      };
    }

    function addRotatingCylinderMarkers(root, radius, h, color, count, width) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color, roughness: .45, metalness: .04 });
      for (let i = 0; i < count; i++) {
        const th = i * Math.PI * 2 / count;
        const mesh = new THREE.Mesh(new THREE.BoxGeometry(width, h * .88, .035), mat);
        mesh.position.set(radius * Math.cos(th), h / 2, radius * Math.sin(th));
        mesh.rotation.y = -th;
        group.add(mesh);
      }
      root.add(group);
      return group;
    }

    function addRotatingDiskMarker(root, R) {
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0x087f79, roughness: .45 });
      const a = new THREE.Mesh(new THREE.BoxGeometry(R * 1.65, .04, .06), mat);
      a.position.y = .08;
      group.add(a);
      const b = new THREE.Mesh(new THREE.BoxGeometry(.06, .04, R * .9), mat);
      b.position.set(R * .38, .08, 0);
      group.add(b);
      root.add(group);
      return group;
    }

    function addInterfaceLine(root, y, L, W, color) {
      const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: .9 });
      const pts = [
        new THREE.Vector3(-L / 2, y, -W / 2),
        new THREE.Vector3(L / 2, y, -W / 2),
        new THREE.Vector3(L / 2, y, W / 2),
        new THREE.Vector3(-L / 2, y, W / 2),
        new THREE.Vector3(-L / 2, y, -W / 2)
      ];
      root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
    }

    function addDiffusionSheet(root, y, L, W, color) {
      const mat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: .75 });
      const yy = clamp(y, .05, 5);
      root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(-L / 2, yy, -W / 2),
        new THREE.Vector3(L / 2, yy, -W / 2),
        new THREE.Vector3(L / 2, yy, W / 2),
        new THREE.Vector3(-L / 2, yy, W / 2),
        new THREE.Vector3(-L / 2, yy, -W / 2)
      ]), mat));
    }

    function addDisk(root, radius, height, color, opacity, y) {
      const mesh = new THREE.Mesh(
        new THREE.CylinderGeometry(radius, radius, height, 96, 1, false),
        new THREE.MeshStandardMaterial({ color, transparent: opacity < 1, opacity, roughness: .62, side: THREE.DoubleSide, depthWrite: opacity >= .5 })
      );
      mesh.position.y = y;
      root.add(mesh);
      return mesh;
    }

    function addCircleLine(root, radius, y, color, opacity) {
      const pts = [];
      for (let i = 0; i <= 160; i++) {
        const th = i * Math.PI * 2 / 160;
        pts.push(new THREE.Vector3(radius * Math.cos(th), y, radius * Math.sin(th)));
      }
      root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color, transparent: true, opacity })));
    }

    function addOscillatingSheet(root, L, W, H) {
      const group = new THREE.Group();
      const mat = new THREE.LineBasicMaterial({ color: 0x087f79, transparent: true, opacity: .42 });
      for (let k = 1; k <= 5; k++) {
        const y = H * k / 6;
        group.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([
          new THREE.Vector3(-L / 2, y, -W / 2),
          new THREE.Vector3(L / 2, y, -W / 2)
        ]), mat));
      }
      root.add(group);
      return group;
    }

    function addBoundaryLayerSurface(root, L, W) {
      const q = state.params.p12;
      const pts = [];
      for (let i = 0; i <= 90; i++) {
        const x = .05 + L * i / 90;
        const delta = 4.9 * Math.sqrt(q.nu * x / Math.max(.001, q.U));
        pts.push(new THREE.Vector3(-L / 2 + x, delta, -W / 2));
      }
      for (let i = 90; i >= 0; i--) {
        const x = .05 + L * i / 90;
        const delta = 4.9 * Math.sqrt(q.nu * x / Math.max(.001, q.U));
        pts.push(new THREE.Vector3(-L / 2 + x, delta, W / 2));
      }
      const geom = new THREE.BufferGeometry().setFromPoints(pts);
      const mat = new THREE.LineBasicMaterial({ color: 0x087f79, transparent: true, opacity: .7 });
      root.add(new THREE.LineLoop(geom, mat));
    }

    function addSphereStreamlines(root, R, U, L) {
      const mat = new THREE.LineBasicMaterial({ color: 0x6f9188, transparent: true, opacity: .72 });
      const seeds = [-1.75, -1.25, -.82, .82, 1.25, 1.75];
      for (const z of [-.95, 0, .95]) {
        for (const y0 of seeds) {
          const pts = [];
          let p = new THREE.Vector3(-L / 2, y0, z * (Math.abs(y0) < 1 ? .45 : .8));
          for (let i = 0; i < 260; i++) {
            pts.push(p.clone());
            const v = sphereVelocity(p.x, p.y, p.z, R, U).normalize().multiplyScalar(.045);
            p = p.clone().add(v);
            const r = p.length();
            if (r < R * 1.06) p.multiplyScalar(R * 1.06 / Math.max(.001, r));
            if (p.x > L / 2) break;
          }
          root.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), mat));
        }
      }
    }

    function sphereVelocity(x, y, z, R, U) {
      const r = Math.max(R * 1.03, Math.hypot(x, y, z));
      const er = new THREE.Vector3(x / r, y / r, z / r);
      const ex = new THREE.Vector3(1, 0, 0);
      const cos = x / r;
      const eTheta = ex.clone().sub(er.clone().multiplyScalar(cos)).multiplyScalar(-1);
      if (eTheta.lengthSq() < 1e-8) eTheta.set(0, 1, 0);
      eTheta.normalize();
      const rr3 = (R * R * R) / (r * r * r);
      const vr = U * cos * (1 - rr3);
      const vt = -U * Math.sqrt(Math.max(0, 1 - cos * cos)) * (1 + .5 * rr3);
      return er.multiplyScalar(vr).add(eTheta.multiplyScalar(vt));
    }

    function writeParticle(pack, i, x, y, z, t) {
      const j = i * 3;
      pack.positions[j] = x;
      pack.positions[j + 1] = y;
      pack.positions[j + 2] = z;
      const c = new THREE.Color(colorForSpeed(t));
      pack.colors[j] = c.r;
      pack.colors[j + 1] = c.g;
      pack.colors[j + 2] = c.b;
    }

    function colorForSpeed(t) {
      t = clamp(Number.isFinite(t) ? t : 0, 0, 1);
      const scaled = t * (palette.length - 1);
      const i = Math.min(palette.length - 2, Math.floor(scaled));
      const f = scaled - i;
      return new THREE.Color(palette[i]).lerp(new THREE.Color(palette[i + 1]), f).getHex();
    }

    function drawProfile() {
      const ctx = els.profile.getContext("2d");
      const W = els.profile.width;
      const H = els.profile.height;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, W, H);
      ctx.strokeStyle = "#d7dfda";
      ctx.lineWidth = 2;
      for (let i = 1; i < 5; i++) {
        const y = 28 + i * (H - 62) / 5;
        ctx.beginPath(); ctx.moveTo(42, y); ctx.lineTo(W - 24, y); ctx.stroke();
      }

      const data = byId[state.active].profile();
      state.profileData = data;
      const xs = data.map(p => p.x);
      const ys = data.map(p => p.y);
      const xmin = Math.min(...xs), xmax = Math.max(...xs);
      const ymin = Math.min(...ys), ymax = Math.max(...ys);
      const padL = 48, padR = 24, padT = 24, padB = 38;
      const sx = x => padL + (x - xmin) / Math.max(1e-8, xmax - xmin) * (W - padL - padR);
      const sy = y => H - padB - (y - ymin) / Math.max(1e-8, ymax - ymin) * (H - padT - padB);

      ctx.strokeStyle = "#9facaa";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(padL, padT); ctx.lineTo(padL, H - padB); ctx.lineTo(W - padR, H - padB); ctx.stroke();

      ctx.strokeStyle = "#087f79";
      ctx.lineWidth = 5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();
      data.forEach((p, i) => {
        const xx = sx(p.x), yy = sy(p.y);
        if (i) ctx.lineTo(xx, yy); else ctx.moveTo(xx, yy);
      });
      ctx.stroke();

      ctx.fillStyle = "#17211f";
      ctx.font = "24px ui-sans-serif, system-ui";
      ctx.fillText(profileLabel(), padL, 22);
      ctx.fillStyle = "#64706b";
      ctx.font = "21px ui-sans-serif, system-ui";
      ctx.fillText(fmt(xmin), padL, H - 10);
      const maxText = fmt(xmax);
      ctx.fillText(maxText, W - padR - ctx.measureText(maxText).width, H - 10);
    }

    function drawSceneProfile() {
      const ctx = els.sceneProfile.getContext("2d");
      const W = els.sceneProfile.width;
      const H = els.sceneProfile.height;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "rgba(255,255,255,.92)";
      ctx.fillRect(0, 0, W, H);

      const data = byId[state.active].profile().filter(p => Number.isFinite(p.x) && Number.isFinite(p.y));
      if (data.length < 2) return;
      const xs = data.map(p => p.x), ys = data.map(p => p.y);
      const xmin = Math.min(...xs), xmax = Math.max(...xs);
      const ymin = Math.min(...ys), ymax = Math.max(...ys);
      const padL = 42, padR = 22, padT = 38, padB = 34;
      const sx = x => padL + (x - xmin) / Math.max(1e-8, xmax - xmin) * (W - padL - padR);
      const sy = y => H - padB - (y - ymin) / Math.max(1e-8, ymax - ymin) * (H - padT - padB);

      ctx.strokeStyle = "#d7dfda";
      ctx.lineWidth = 2;
      for (let i = 1; i < 4; i++) {
        const y = padT + i * (H - padT - padB) / 4;
        ctx.beginPath();
        ctx.moveTo(padL, y);
        ctx.lineTo(W - padR, y);
        ctx.stroke();
      }

      ctx.strokeStyle = "#8aa39a";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(padL, padT);
      ctx.lineTo(padL, H - padB);
      ctx.lineTo(W - padR, H - padB);
      ctx.stroke();

      if (xmin < 0 && xmax > 0) {
        const zx = sx(0);
        ctx.strokeStyle = "#c08a2a";
        ctx.beginPath();
        ctx.moveTo(zx, padT);
        ctx.lineTo(zx, H - padB);
        ctx.stroke();
      }

      const zeroX = xmin < 0 && xmax > 0 ? sx(0) : sx(xmin);
      ctx.strokeStyle = "rgba(49,95,149,.55)";
      ctx.lineWidth = 2;
      for (let i = 0; i <= 5; i++) {
        const p = data[Math.round(i * (data.length - 1) / 5)];
        ctx.beginPath();
        ctx.moveTo(zeroX, sy(p.y));
        ctx.lineTo(sx(p.x), sy(p.y));
        ctx.stroke();
      }

      ctx.strokeStyle = "#087f79";
      ctx.lineWidth = 5;
      ctx.lineJoin = "round";
      ctx.lineCap = "round";
      ctx.beginPath();
      data.forEach((p, i) => {
        const x = sx(p.x), y = sy(p.y);
        if (i) ctx.lineTo(x, y); else ctx.moveTo(x, y);
      });
      ctx.stroke();

      ctx.fillStyle = "#17211f";
      ctx.font = "bold 24px ui-sans-serif, system-ui";
      ctx.fillText(profileLabel(), 18, 26);
      ctx.fillStyle = "#64706b";
      ctx.font = "18px ui-sans-serif, system-ui";
      ctx.fillText(fmt(xmin), padL, H - 9);
      const maxText = fmt(xmax);
      ctx.fillText(maxText, W - padR - ctx.measureText(maxText).width, H - 9);
    }

    function profileLabel() {
      return {
        p1: "u(y)",
        p2: "u(y)",
        p3: "u(y)",
        p4: "u(r)",
        p5: "Q(a)",
        p6i: "u(y)",
        p6ii: "u(y)",
        p6iii: "u(r)",
        p6tc: "v_theta(r)",
        p7: "F(Re)",
        p8: "u(y,t)",
        p9: "v_theta(r,t)",
        p10: "u(y,t)",
        p11: "u(y,t)",
        p12: "v_x/U",
        p13: "v_theta(y)"
      }[state.active];
    }

    function uP1(y) {
      const q = state.params.p1;
      const d = Math.max(.001, q.d);
      const mu = Math.max(.001, q.mu);
      return q.U * y / d + (q.G / (2 * mu)) * y * (d - y);
    }

    function uFilm(y) {
      const q = state.params.p2;
      const mu = Math.max(.001, q.mu);
      const d = Math.max(.001, q.d);
      const s = Math.sin(THREE.MathUtils.degToRad(q.theta));
      return q.rho * q.g * s / mu * (d * y - y * y / 2);
    }

    function uPipe(r) {
      const q = state.params.p4;
      const mu = Math.max(.001, q.mu);
      const a = Math.max(.001, q.a);
      return Math.max(0, q.G / (4 * mu) * (a * a - r * r));
    }

    function tcAB() {
      const q = state.params.p6tc;
      const a = Math.max(.001, q.a);
      const b = Math.max(a + .001, q.b);
      const den = b * b - a * a;
      return {
        A: (q.omega2 * b * b - q.omega1 * a * a) / den,
        B: (a * a * b * b * (q.omega1 - q.omega2)) / den
      };
    }

    function vTheta(r) {
      const { A, B } = tcAB();
      return A * r + B / Math.max(.001, r);
    }

    function rayleighUnstable() {
      const q = state.params.p6tc;
      const a = q.a, b = Math.max(q.a + .08, q.b);
      const { A, B } = tcAB();
      for (let i = 0; i < 40; i++) {
        const r = a + (b - a) * i / 39;
        const l = A * r * r + B;
        if (4 * A * r * l < 0) return true;
      }
      return false;
    }

    function reynolds() {
      const q = state.params.p7;
      return q.rho * q.U * q.D / Math.max(.001, q.mu);
    }

    function uCP(q, y) {
      const d = Math.max(.001, q.d), mu = Math.max(.001, q.mu);
      return q.U * y / d + (q.G / (2 * mu)) * y * (d - y);
    }

    function uTwoFilm(y) {
      const q = state.params.p3;
      const h1 = Math.max(.001, q.h1), h2 = Math.max(.001, q.h2);
      const s = Math.sin(THREE.MathUtils.degToRad(q.theta));
      const g = q.g * s;
      if (y <= h1) {
        return g / Math.max(.001, q.mu1) * (q.rho1 * (h1 * y - y * y / 2) + q.rho2 * h2 * y);
      }
      const uInt = g / Math.max(.001, q.mu1) * (q.rho1 * h1 * h1 / 2 + q.rho2 * h2 * h1);
      const D = h1 + h2;
      return uInt + q.rho2 * g / Math.max(.001, q.mu2) * (D * (y - h1) - (y * y - h1 * h1) / 2);
    }

    function uP5Pipe(r) {
      const q = state.params.p5;
      const a = Math.max(.001, q.a), mu = Math.max(.001, q.rho * q.nu);
      return Math.max(0, q.G / (4 * mu) * (a * a - r * r));
    }

    function uP6II(y) {
      const q = state.params.p6ii;
      const d = Math.max(.001, q.d), mu = Math.max(.001, q.mu);
      const s = Math.sin(THREE.MathUtils.degToRad(q.theta));
      return -q.U + q.rho * q.g * s / mu * (d * y - y * y / 2);
    }

    function uAnnular(r) {
      const q = state.params.p6iii;
      const a = Math.max(.001, q.a), b = Math.max(a + .001, q.b);
      return q.U1 + (q.U2 - q.U1) * Math.log(Math.max(a, r) / a) / Math.log(b / a);
    }

    function uStokes1(y) {
      const q = state.params.p8;
      return q.U * erfc(y / (2 * Math.sqrt(Math.max(.0001, q.nu * q.t))));
    }

    function vVortex(r) {
      const q = state.params.p9;
      r = Math.max(.001, r);
      return q.Gamma / (2 * Math.PI * r) * (1 - Math.exp(-r * r / (4 * Math.max(.0001, q.nu * q.t))));
    }

    function uOscillating(y, t) {
      const q = state.params.p10;
      const delta = Math.sqrt(2 * q.nu / Math.max(.001, q.omega));
      return q.U0 * Math.exp(-y / delta) * Math.cos(q.omega * t - y / delta);
    }

    function uFiniteStart(y) {
      const q = state.params.p11;
      const h = Math.max(.001, q.h), nu = Math.max(.001, q.nu), t = Math.max(.0001, q.t);
      let u = q.U * (1 - y / h);
      const terms = Math.max(4, Math.min(80, Math.round(q.terms)));
      for (let n = 1; n <= terms; n++) {
        u -= 2 * q.U / Math.PI * Math.sin(n * Math.PI * y / h) / n * Math.exp(-n * n * Math.PI * Math.PI * nu * t / (h * h));
      }
      return u;
    }

    function blasiusFp(eta) {
      return clamp(1 - Math.exp(-0.28 * eta * eta - 0.035 * eta ** 3), 0, 1);
    }

    function diskVtheta(r, y) {
      const q = state.params.p13;
      const delta = Math.sqrt(q.nu / Math.max(.001, q.Omega));
      return q.Omega * r * Math.exp(-y / Math.max(.001, delta));
    }

    function erfc(x) {
      const z = Math.abs(x);
      const t = 1 / (1 + .5 * z);
      const ans = t * Math.exp(-z * z - 1.26551223 + t * (1.00002368 + t * (.37409196 + t * (.09678418 + t * (-.18628806 + t * (.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-.82215223 + t * .17087277)))))))));
      return x >= 0 ? ans : 2 - ans;
    }

    function metricsP1() {
      const q = state.params.p1;
      const d = Math.max(.001, q.d);
      const mu = Math.max(.001, q.mu);
      const umax = sampleMax(y => Math.abs(uP1(y)), 0, d);
      const flow = q.U * d / 2 + q.G * d ** 3 / (12 * mu);
      return [
        ["max |u|", fmt(umax)],
        ["q por ancho", fmt(flow)],
        ["tau(0)", fmt(mu * q.U / d + q.G * d / 2)],
        ["tau(d)", fmt(mu * q.U / d - q.G * d / 2)]
      ];
    }

    function metricsP2() {
      const q = state.params.p2;
      const d = Math.max(.001, q.d);
      const umax = uFilm(d);
      return [
        ["u_max", fmt(umax)],
        ["u_prom", fmt(2 * umax / 3)],
        ["caudal/ancho", fmt(2 * umax * d / 3)],
        ["m_dot/ancho", fmt(q.rho * 2 * umax * d / 3)]
      ];
    }

    function metricsP3() {
      const q = state.params.p3;
      const h1 = Math.max(.001, q.h1), h2 = Math.max(.001, q.h2), D = h1 + h2;
      const umax = sampleMax(y => Math.abs(uTwoFilm(y)), 0, D);
      const flow = integrateTrap(uTwoFilm, 0, D, 220);
      return [
        ["max |u|", fmt(umax)],
        ["u interfase", fmt(uTwoFilm(h1))],
        ["q por ancho", fmt(flow)],
        ["h total", fmt(D)]
      ];
    }

    function metricsP4() {
      const q = state.params.p4;
      const a = Math.max(.001, q.a);
      const mu = Math.max(.001, q.mu);
      return [
        ["u_max", fmt(uPipe(0))],
        ["Q", fmt(Math.PI * q.G * a ** 4 / (8 * mu))],
        ["u_prom", fmt(uPipe(0) / 2)],
        ["tau_w", fmt(-q.G * a / 2)]
      ];
    }

    function metricsP5() {
      const q = state.params.p5;
      const a = Math.max(.001, q.a), mu = Math.max(.001, q.rho * q.nu);
      const Q = Math.PI * q.G * a ** 4 / (8 * mu);
      return [
        ["Q exacto", fmt(Q)],
        ["Q si 2a", fmt(16 * Q)],
        ["mu=rho nu", fmt(mu)],
        ["u_max", fmt(uP5Pipe(0))]
      ];
    }

    function metricsP6I() {
      const q = state.params.p6i;
      const d = Math.max(.001, q.d), mu = Math.max(.001, q.mu);
      const raw = d / 2 + mu * q.U / ((Math.abs(q.G) < 1e-8 ? 1e-8 : q.G) * d);
      const y0 = clamp(raw, 0, d);
      return [
        ["y0 calculado", fmt(raw)],
        ["y max fisico", fmt(y0)],
        ["u(y max)", fmt(uCP(q, y0))],
        ["q por ancho", fmt(q.U * d / 2 + q.G * d ** 3 / (12 * mu))]
      ];
    }

    function metricsP6II() {
      const q = state.params.p6ii;
      const d = Math.max(.001, q.d), s = Math.sin(THREE.MathUtils.degToRad(q.theta));
      return [
        ["sigma pared", fmt(q.rho * q.g * d * s)],
        ["u superficie", fmt(uP6II(d))],
        ["q por ancho", fmt(-q.U * d + q.rho * q.g * s * d ** 3 / (3 * Math.max(.001, q.mu)))],
        ["tau libre", "0"]
      ];
    }

    function metricsP6III() {
      const q = state.params.p6iii;
      const a = Math.max(.001, q.a), b = Math.max(a + .001, q.b);
      const Q = 2 * Math.PI * integrateTrap(r => r * uAnnular(r), a, b, 260);
      return [
        ["Q", fmt(Q)],
        ["u(a)", fmt(uAnnular(a))],
        ["u(b)", fmt(uAnnular(b))],
        ["ln(b/a)", fmt(Math.log(b / a))]
      ];
    }

    function metricsP6TC() {
      const q = state.params.p6tc;
      const { A, B } = tcAB();
      const a = Math.max(.001, q.a);
      const b = Math.max(a + .001, q.b);
      const gap = b - a;
      const taLike = q.rho * Math.abs(q.omega1) * a * gap / Math.max(.001, q.mu);
      return [
        ["A", fmt(A)],
        ["B", fmt(B)],
        ["tau(a)", fmt(-2 * q.mu * B / (a * a))],
        ["N/L", fmt(-4 * Math.PI * q.mu * B)],
        ["Ta visual", fmt(taLike)],
        ["Rayleigh", rayleighUnstable() ? "tendencia inestable" : "estable inviscido"]
      ];
    }

    function metricsP7() {
      const q = state.params.p7;
      const Re = reynolds();
      const stokes = 3 * Math.PI * q.mu * q.D * q.U;
      const inertial = .5 * q.Cd * q.rho * q.U ** 2 * Math.PI * q.D ** 2 / 4;
      const terminal = (q.rhoS - q.rho) * 9.8 * q.D ** 2 / (18 * Math.max(.001, q.mu));
      return [
        ["Re", fmt(Re)],
        ["F Stokes", fmt(stokes)],
        ["F alto Re", fmt(inertial)],
        ["U_t Stokes", fmt(terminal)]
      ];
    }

    function metricsP8() {
      const q = state.params.p8;
      const delta = 2 * Math.sqrt(q.nu * q.t);
      return [
        ["2 sqrt(nu t)", fmt(delta)],
        ["u(delta)", fmt(uStokes1(delta))],
        ["omega pared", fmt(q.U / Math.sqrt(Math.PI * q.nu * q.t))],
        ["t para L=1", fmt(1 / Math.max(.001, q.nu))]
      ];
    }

    function metricsP9() {
      const q = state.params.p9;
      const core = Math.sqrt(4 * q.nu * q.t);
      return [
        ["sqrt(4 nu t)", fmt(core)],
        ["Omega nucleo", fmt(q.Gamma / (8 * Math.PI * q.nu * q.t))],
        ["v(core)", fmt(vVortex(core))],
        ["Gamma(inf)", fmt(q.Gamma)]
      ];
    }

    function metricsP10() {
      const q = state.params.p10;
      const delta = Math.sqrt(2 * q.nu / Math.max(.001, q.omega));
      return [
        ["delta", fmt(delta)],
        ["u(delta)", fmt(uOscillating(delta, state.time))],
        ["periodo", fmt(2 * Math.PI / q.omega)],
        ["fase en delta", "-1 rad"]
      ];
    }

    function metricsP11() {
      const q = state.params.p11;
      const h = Math.max(.001, q.h);
      return [
        ["u(h/2)", fmt(uFiniteStart(h / 2))],
        ["t_h", fmt(h * h / Math.max(.001, q.nu))],
        ["terminos", fmt(Math.round(q.terms))],
        ["u estacionario", "lineal"]
      ];
    }

    function metricsP12() {
      const q = state.params.p12;
      const delta = 4.9 * Math.sqrt(q.nu * q.xmax / Math.max(.001, q.U));
      return [
        ["delta(xmax)", fmt(delta)],
        ["Re_x", fmt(q.U * q.xmax / Math.max(.001, q.nu))],
        ["escala", "sqrt(x)"],
        ["vx borde", "U"]
      ];
    }

    function metricsP13() {
      const q = state.params.p13;
      const delta = Math.sqrt(q.nu / Math.max(.001, q.Omega));
      return [
        ["delta", fmt(delta)],
        ["v borde", fmt(q.Omega * q.R)],
        ["tiempo rot", fmt(1 / q.Omega)],
        ["escala", "sqrt(nu/Omega)"]
      ];
    }

    function profileP1() {
      const d = Math.max(.001, state.params.p1.d);
      return Array.from({ length: 90 }, (_, i) => {
        const y = d * i / 89;
        return { x: uP1(y), y };
      });
    }

    function profileP2() {
      const d = Math.max(.001, state.params.p2.d);
      return Array.from({ length: 90 }, (_, i) => {
        const y = d * i / 89;
        return { x: uFilm(y), y };
      });
    }

    function profileP3() {
      const q = state.params.p3;
      const D = Math.max(.001, q.h1 + q.h2);
      return Array.from({ length: 100 }, (_, i) => {
        const y = D * i / 99;
        return { x: uTwoFilm(y), y };
      });
    }

    function profileP4() {
      const a = Math.max(.001, state.params.p4.a);
      return Array.from({ length: 120 }, (_, i) => {
        const r = -a + 2 * a * i / 119;
        return { x: uPipe(Math.abs(r)), y: r };
      });
    }

    function profileP5() {
      const q = state.params.p5;
      return Array.from({ length: 90 }, (_, i) => {
        const a = 0.15 + 2.25 * i / 89;
        const Q = Math.PI * q.G * a ** 4 / (8 * Math.max(.001, q.rho * q.nu));
        return { x: Q, y: a };
      });
    }

    function profileP6I() {
      const q = state.params.p6i;
      const d = Math.max(.001, q.d);
      return Array.from({ length: 90 }, (_, i) => {
        const y = d * i / 89;
        return { x: uCP(q, y), y };
      });
    }

    function profileP6II() {
      const d = Math.max(.001, state.params.p6ii.d);
      return Array.from({ length: 90 }, (_, i) => {
        const y = d * i / 89;
        return { x: uP6II(y), y };
      });
    }

    function profileP6III() {
      const q = state.params.p6iii;
      const a = Math.max(.001, q.a), b = Math.max(a + .001, q.b);
      return Array.from({ length: 110 }, (_, i) => {
        const r = a + (b - a) * i / 109;
        return { x: uAnnular(r), y: r };
      });
    }

    function profileP6TC() {
      const q = state.params.p6tc;
      const a = Math.max(.001, q.a);
      const b = Math.max(a + .001, q.b);
      return Array.from({ length: 110 }, (_, i) => {
        const r = a + (b - a) * i / 109;
        return { x: vTheta(r), y: r };
      });
    }

    function profileP7() {
      const q = state.params.p7;
      return Array.from({ length: 90 }, (_, i) => {
        const Re = Math.pow(10, -1 + 4 * i / 89);
        const low = 24 / Re * (1 + 0.15 * Math.pow(Re, .687));
        const blend = 1 / (1 + Math.exp(-(Math.log10(Re) - 2.6) * 4));
        const cd = low * (1 - blend) + q.Cd * blend;
        return { x: Math.log10(Re), y: Math.log10(cd) };
      });
    }

    function profileP8() {
      const q = state.params.p8;
      return Array.from({ length: 100 }, (_, i) => {
        const y = q.ymax * i / 99;
        return { x: uStokes1(y), y };
      });
    }

    function profileP9() {
      return Array.from({ length: 110 }, (_, i) => {
        const r = .03 + 3 * i / 109;
        return { x: vVortex(r), y: r };
      });
    }

    function profileP10() {
      const q = state.params.p10;
      return Array.from({ length: 110 }, (_, i) => {
        const y = q.ymax * i / 109;
        return { x: uOscillating(y, state.time), y };
      });
    }

    function profileP11() {
      const q = state.params.p11;
      return Array.from({ length: 100 }, (_, i) => {
        const y = q.h * i / 99;
        return { x: uFiniteStart(y), y };
      });
    }

    function profileP12() {
      return Array.from({ length: 100 }, (_, i) => {
        const eta = 8 * i / 99;
        return { x: blasiusFp(eta), y: eta };
      });
    }

    function profileP13() {
      const q = state.params.p13;
      const H = Math.max(.6, 4 * Math.sqrt(q.nu / Math.max(.001, q.Omega)));
      return Array.from({ length: 100 }, (_, i) => {
        const y = H * i / 99;
        return { x: diskVtheta(q.R, y), y };
      });
    }

    function randomWakeParticle(L, W, H, R, atStart = false) {
      let p;
      do {
        p = {
          x: atStart ? -L / 2 : rand(-L / 2, L / 2),
          y: rand(-H / 2, H / 2),
          z: rand(-W / 2, W / 2)
        };
      } while (Math.hypot(p.x, p.y, p.z) < R * 1.08);
      return p;
    }

    function sampleMax(fn, a, b) {
      let m = .0001;
      for (let i = 0; i < 140; i++) {
        const x = a + (b - a) * i / 139;
        m = Math.max(m, Math.abs(fn(x)));
      }
      return m;
    }

    function integrateTrap(fn, a, b, n) {
      let s = 0;
      for (let i = 0; i <= n; i++) {
        const x = a + (b - a) * i / n;
        s += fn(x) * (i === 0 || i === n ? .5 : 1);
      }
      return s * (b - a) / n;
    }

    function rand(a, b) {
      return a + Math.random() * (b - a);
    }

    function wrap(x, a, b) {
      const L = b - a;
      while (x < a) x += L;
      while (x > b) x -= L;
      return x;
    }

    function clamp(x, a, b) {
      return Math.max(a, Math.min(b, x));
    }

    function fmt(x) {
      if (!Number.isFinite(x)) return "--";
      const ax = Math.abs(x);
      if (ax > 999 || (ax > 0 && ax < .01)) return x.toExponential(2);
      return x.toFixed(ax >= 10 ? 2 : 3).replace(/\.?0+$/, "");
    }

    function fmtInput(x) {
      return Number(x).toFixed(3).replace(/\.?0+$/, "");
    }
  </script>
