<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guia 4 v4 - Simulador 3D</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [["\\(", "\\)"], ["$", "$"]] },
      startup: {
        typeset: false,
        pageReady: () => MathJax.startup.defaultPageReady().then(() => {
          if (window.renderMathNow) window.renderMathNow();
        })
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211f;
      --muted: #64706b;
      --line: #d7dfda;
      --paper: #f7f5ef;
      --panel: #ffffff;
      --panel-soft: #eef5f1;
      --teal: #087f79;
      --blue: #315f95;
      --amber: #c08a2a;
      --danger: #9b3f34;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--paper);
    }

    body {
      display: grid;
      grid-template-columns: 220px minmax(520px, 1fr) 390px;
      min-width: 1050px;
    }

    button, input {
      font: inherit;
    }

    .nav {
      border-right: 1px solid var(--line);
      background: #fbfaf5;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: auto;
    }

    .brand {
      padding: 2px 4px 10px;
      border-bottom: 1px solid var(--line);
    }

    .brand h1 {
      margin: 0;
      font-size: 18px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .brand p {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .module-list {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .module-btn {
      width: 100%;
      border: 1px solid transparent;
      background: transparent;
      color: var(--ink);
      text-align: left;
      border-radius: 7px;
      padding: 10px 10px;
      cursor: pointer;
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 8px;
      align-items: center;
    }

    .module-btn:hover {
      background: #f0f3ef;
    }

    .module-btn.active {
      background: #e5f2ee;
      border-color: #bddbd4;
    }

    .badge {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      font-weight: 750;
      font-size: 12px;
      color: #f8fbfa;
      background: var(--teal);
    }

    .module-btn:nth-child(2n) .badge { background: var(--blue); }
    .module-btn:nth-child(3n) .badge { background: var(--amber); }

    .module-name {
      display: block;
      font-weight: 720;
      font-size: 13px;
      line-height: 1.2;
    }

    .module-sub {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.25;
    }

    .stage {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(#e9eeeb 1px, transparent 1px),
        linear-gradient(90deg, #e9eeeb 1px, transparent 1px),
        #f7f8f4;
      background-size: 64px 64px;
    }

    #scene3d {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }

    .hud {
      position: absolute;
      left: 18px;
      top: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }

    .hud-title {
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(215,223,218,.9);
      border-radius: 7px;
      padding: 8px 10px;
      backdrop-filter: blur(6px);
      max-width: 520px;
    }

    .hud-title h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .hud-title p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 12px;
    }

    .scene-actions {
      position: absolute;
      right: 18px;
      top: 16px;
      display: flex;
      gap: 8px;
    }

    .scene-actions button,
    .right button {
      border: 1px solid var(--line);
      background: rgba(255,255,255,.9);
      color: var(--ink);
      border-radius: 7px;
      padding: 8px 11px;
      cursor: pointer;
    }

    .scene-actions button:hover,
    .right button:hover {
      background: #eef5f1;
    }

    .colorbar {
      position: absolute;
      right: 20px;
      bottom: 22px;
      width: 76px;
      background: rgba(255,255,255,.86);
      border: 1px solid rgba(215,223,218,.95);
      border-radius: 7px;
      padding: 9px;
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 7px;
      align-items: stretch;
      backdrop-filter: blur(6px);
    }

    .scene-profile {
      position: absolute;
      left: 18px;
      bottom: 22px;
      width: 190px;
      height: 142px;
      border: 1px solid rgba(215,223,218,.95);
      border-radius: 7px;
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(6px);
    }

    .bar {
      height: 158px;
      border: 1px solid #aebbb5;
      background: linear-gradient(to top, #2c3f90, #2b78a0, #27a1a2, #72bd72, #d3d46a);
    }

    .bar-labels {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      color: var(--muted);
      font-size: 11px;
      line-height: 1;
    }

    .bar-labels strong {
      color: var(--ink);
      font-size: 11px;
      font-weight: 750;
    }

    .right {
      border-left: 1px solid var(--line);
      background: #fbfaf5;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      min-height: 0;
    }

    .right-head {
      padding: 14px 16px 12px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
    }

    .right-head h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0;
    }

    .controls {
      padding: 12px 16px 10px;
      border-bottom: 1px solid var(--line);
      display: grid;
      gap: 11px;
      background: #ffffff;
    }

    .control {
      display: grid;
      grid-template-columns: 1fr 70px;
      grid-template-areas:
        "label value"
        "range range";
      gap: 5px 10px;
      align-items: center;
    }

    .control label {
      grid-area: label;
      color: var(--ink);
      font-size: 12px;
      font-weight: 680;
      line-height: 1.2;
    }

    .control input[type="number"] {
      grid-area: value;
      width: 70px;
      border: 1px solid var(--line);
      background: #fbfdfa;
      border-radius: 6px;
      padding: 4px 6px;
      font-size: 12px;
      text-align: right;
    }

    .control input[type="range"] {
      grid-area: range;
      width: 100%;
      accent-color: var(--teal);
      cursor: ew-resize;
    }

    .scroll {
      min-height: 0;
      overflow: auto;
      padding: 14px 16px 18px;
      display: grid;
      gap: 14px;
    }

    .section {
      border-top: 1px solid var(--line);
      padding-top: 12px;
    }

    .section:first-child {
      border-top: 0;
      padding-top: 0;
    }

    .section h3 {
      margin: 0 0 9px;
      font-size: 12px;
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    #profile {
      width: 100%;
      height: 164px;
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 7px;
      display: block;
    }

    .metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .metric {
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 7px;
      padding: 8px 9px;
      min-height: 54px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.2;
    }

    .metric b {
      display: block;
      margin-top: 4px;
      font-size: 14px;
      line-height: 1.15;
      word-break: break-word;
    }

    .steps {
      display: grid;
      gap: 10px;
    }

    .step {
      display: grid;
      grid-template-columns: 28px 1fr;
      gap: 9px;
      align-items: start;
    }

    .step b {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: #d9f0ec;
      color: var(--teal);
      font-size: 12px;
    }

    .step span {
      font-size: 13px;
      line-height: 1.42;
    }

    .formula {
      border: 1px solid var(--line);
      background: #ffffff;
      border-radius: 7px;
      padding: 10px;
      font-size: 13px;
      overflow-x: auto;
    }

    .formula div + div {
      margin-top: 8px;
    }

    @media (max-width: 1180px) {
      body { grid-template-columns: 190px minmax(480px, 1fr) 340px; }
    }
  </style>
</head>
<body>
  <aside class="nav">
    <div class="brand">
      <h1>Guia 4 v4</h1>
      <p>Fluidos viscosos, soluciones analiticas.</p>
    </div>
    <div class="module-list" id="moduleList"></div>
  </aside>

  <main class="stage">
    <canvas id="scene3d"></canvas>
    <div class="hud">
      <div class="hud-title">
        <h2 id="sceneTitle"></h2>
        <p id="sceneSubtitle"></p>
      </div>
    </div>
    <div class="scene-actions">
      <button id="resetView" type="button">vista</button>
    </div>
    <div class="colorbar">
      <div class="bar"></div>
      <div class="bar-labels">
        <strong>vel.</strong>
        <span>alto</span>
        <span>bajo</span>
      </div>
    </div>
    <canvas class="scene-profile" id="sceneProfile" width="380" height="284"></canvas>
  </main>

  <aside class="right">
    <div class="right-head">
      <h2>Parametros</h2>
      <button id="resetParams" type="button">reset</button>
    </div>
    <div class="controls" id="controls"></div>
    <div class="scroll">
      <section class="section">
        <h3>Perfil usado</h3>
        <canvas id="profile" width="680" height="328"></canvas>
      </section>
      <section class="section">
        <h3>Numeros</h3>
        <div class="metrics" id="metrics"></div>
      </section>
      <section class="section">
        <h3>Cuentas</h3>
        <div class="steps" id="steps"></div>
      </section>
      <section class="section">
        <h3>Formula final</h3>
        <div class="formula" id="formula"></div>
      </section>
    </div>
  </aside>

  <script src="./vendor/three.min.js"></script>
  <script src="./vendor/OrbitControls-global.js"></script>
  <script>
    const OrbitControls = THREE.OrbitControls;
    const els = {
      canvas: document.getElementById("scene3d"),
      moduleList: document.getElementById("moduleList"),
      controls: document.getElementById("controls"),
      metrics: document.getElementById("metrics"),
      steps: document.getElementById("steps"),
      formula: document.getElementById("formula"),
      profile: document.getElementById("profile"),
      title: document.getElementById("sceneTitle"),
      subtitle: document.getElementById("sceneSubtitle"),
      resetView: document.getElementById("resetView"),
      resetParams: document.getElementById("resetParams"),
      sceneProfile: document.getElementById("sceneProfile")
    };

    const palette = ["#1f2c86", "#1767a6", "#009aa7", "#36a862", "#d4c84e"];
    const defaults = {
      p1: { U: 1.6, d: 1.2, mu: 1, G: 1.3, speed: 1 },
      p2: { theta: 28, d: 0.9, mu: 1, rho: 1, g: 9.8, speed: 0.55 },
      p3: { theta: 28, h1: 0.65, h2: 0.55, mu1: 1.4, mu2: 0.55, rho1: 1.2, rho2: 0.85, g: 9.8, speed: 0.55 },
      p4: { a: 1, mu: 1, G: 2.4, speed: 0.9 },
      p5: { a: 1, G: 2.2, nu: 1, rho: 1, speed: 0.8 },
      p6i: { U: 1.5, d: 1.15, mu: 1, G: 1.6, speed: 1 },
      p6ii: { U: 1.1, theta: 30, d: 1.0, mu: 1, rho: 1, g: 9.8, speed: 0.65 },
      p6iii: { a: 0.45, b: 1.35, U1: 1.8, U2: 0.25, speed: 0.85 },
      p6tc: { a: 0.58, b: 1.45, omega1: 3.2, omega2: 0.25, mu: 1, rho: 1, height: 5.6, speed: 0.8 },
      p7: { D: 1.05, U: 1.2, mu: 1, rho: 1, rhoS: 2.6, Cd: 0.45, speed: 0.8 },
      p8: { U: 1.6, nu: 0.45, t: 0.65, ymax: 3.0, speed: 0.7 },
      p9: { Gamma: 5.0, nu: 0.45, t: 0.7, speed: 0.85 },
      p10: { U0: 1.5, nu: 0.45, omega: 3.0, ymax: 3.2, speed: 0.75 },
      p11: { U: 1.5, h: 1.8, nu: 0.45, t: 0.35, terms: 24, speed: 0.65 },
      p12: { U: 1.4, nu: 0.18, xmax: 5.2, speed: 0.7 },
      p13: { Omega: 3.0, nu: 0.35, R: 1.8, speed: 0.75 }
    };

    const state = {
      active: "p1",
      params: structuredClone(defaults),
      frame: null,
      particles: null,
      staticTick: () => {},
      profileData: [],
      maxSpeed: 1,
      time: 0
    };

    const modules = [
      {
        id: "p1",
        short: "P1",
        title: "P1: sandwich Couette-Poiseuille",
        subtitle: "Dos placas paralelas con placa superior movil y gradiente de presion.",
        controls: [
          ["U", "velocidad placa U", -3, 3, 0.05],
          ["d", "separacion d", 0.35, 2.8, 0.02],
          ["mu", "viscosidad mu", 0.15, 5, 0.05],
          ["G", "G = -dp/dx", -6, 6, 0.05],
          ["speed", "velocidad visual", 0, 3, 0.05]
        ],
        formula: [
          String.raw`\(u(y)=\frac{U}{d}y+\frac{G}{2\mu}y(d-y)\)`,
          String.raw`\(\tau_{xy}(y)=\mu\frac{du}{dy}=\mu\frac{U}{d}+G\left(\frac d2-y\right)\)`,
          String.raw`\(q=\int_0^d u(y)\,dy=\frac{Ud}{2}+\frac{Gd^3}{12\mu}\)`
        ],
        steps: [
          String.raw`Tomamos \(\vec v=u(y)\hat x\). Como no depende de \(x\), el termino convectivo \(u\,\partial_x u\) se anula.`,
          String.raw`La ecuacion en \(x\) queda \(0=-\partial_x p+\mu u''\). Definiendo \(G=-\partial_x p\), resulta \(\mu u''=-G\).`,
          String.raw`Integramos dos veces: \(u(y)=-Gy^2/(2\mu)+C_1y+C_2\).`,
          String.raw`No deslizamiento: \(u(0)=0\) y \(u(d)=U\). Con esas constantes aparece el termino lineal de Couette mas la parabola de Poiseuille.`
        ],
        build: buildP1,
        metrics: metricsP1,
        profile: profileP1
      },
      {
        id: "p2",
        short: "P2",
        title: "P2: pelicula en plano inclinado",
        subtitle: "Capa viscosa que escurre por gravedad sobre una pared solida.",
        controls: [
          ["theta", "angulo theta [deg]", 0, 70, 1],
          ["d", "espesor d", 0.25, 2.2, 0.02],
          ["mu", "viscosidad mu", 0.15, 5, 0.05],
          ["rho", "densidad rho", 0.2, 4, 0.05],
          ["g", "gravedad g", 0, 15, 0.1],
          ["speed", "velocidad visual", 0, 1.2, 0.02]
        ],
        formula: [
          String.raw`\(u(y)=\frac{\rho g\sin\theta}{\mu}\left(dy-\frac{y^2}{2}\right)\)`,
          String.raw`\(u_{\max}=u(d)=\frac{\rho g\sin\theta}{2\mu}d^2\)`,
          String.raw`\(\bar u=\frac1d\int_0^d u\,dy=\frac{2}{3}u_{\max}\)`,
          String.raw`\(\dot m'=\rho d\bar u\)`
        ],
        steps: [
          String.raw`Usamos \(x\) paralelo al plano e \(y\) normal a la pared. La fuerza de volumen que empuja es \(\rho g\sin\theta\).`,
          String.raw`Para flujo paralelo estacionario: \(0=\rho g\sin\theta+\mu u''\).`,
          String.raw`La pared impone \(u(0)=0\). En la superficie libre no hay esfuerzo tangencial: \(\tau(d)=\mu u'(d)=0\).`,
          String.raw`Con esas dos condiciones queda una parabola abierta hacia abajo y el maximo cae justo en la superficie libre.`
        ],
        build: buildP2,
        metrics: metricsP2,
        profile: profileP2
      },
      {
        id: "p4",
        short: "P4",
        title: "P4: Poiseuille cilindrico",
        subtitle: "Flujo axial estacionario dentro de un tubo circular.",
        controls: [
          ["a", "radio a", 0.25, 2.4, 0.02],
          ["mu", "viscosidad mu", 0.15, 5, 0.05],
          ["G", "G = -dp/dx", 0, 8, 0.05],
          ["speed", "velocidad visual", 0, 1.8, 0.03]
        ],
        formula: [
          String.raw`\(u(r)=\frac{G}{4\mu}(a^2-r^2)\)`,
          String.raw`\(Q=\int_0^a2\pi r\,u(r)\,dr=\frac{\pi G a^4}{8\mu}\)`,
          String.raw`\(\bar u=Q/(\pi a^2)=u_{\max}/2\)`,
          String.raw`\(\tau_w=\mu u'(a)=-Ga/2\)`
        ],
        steps: [
          String.raw`Por simetria \(\vec v=u(r)\hat x\), y el laplaciano que importa es \(\frac1r(r u')'\).`,
          String.raw`Con \(G=-dp/dx\): \(\frac1r(r u')'=-G/\mu\).`,
          String.raw`La regularidad en \(r=0\) elimina el termino logaritmico. La pared fija \(u(a)=0\).`,
          String.raw`La integral de caudal pesa cada anillo con \(2\pi r\), por eso aparece la ley \(Q\propto a^4\).`
        ],
        build: buildP4,
        metrics: metricsP4,
        profile: profileP4
      },
      {
        id: "p6tc",
        short: "TC",
        title: "P6(iv): Taylor-Couette laminar",
        subtitle: "Cilindros coaxiales rotantes con contornos de modulo de velocidad.",
        controls: [
          ["a", "radio interno a", 0.25, 1.4, 0.02],
          ["b", "radio externo b", 0.55, 2.6, 0.02],
          ["omega1", "Omega interno", -6, 6, 0.05],
          ["omega2", "Omega externo", -6, 6, 0.05],
          ["mu", "viscosidad mu", 0.15, 5, 0.05],
          ["rho", "densidad rho", 0.2, 4, 0.05],
          ["height", "altura visual", 2, 8, 0.1],
          ["speed", "velocidad visual", 0, 2, 0.03]
        ],
        formula: [
          String.raw`\(v_\theta(r)=Ar+\frac{B}{r}\)`,
          String.raw`\(A=\frac{\Omega_2b^2-\Omega_1a^2}{b^2-a^2}\)`,
          String.raw`\(B=\frac{a^2b^2(\Omega_1-\Omega_2)}{b^2-a^2}\)`,
          String.raw`\(\tau_{r\theta}=\mu\left(\frac{dv_\theta}{dr}-\frac{v_\theta}{r}\right)=-\frac{2\mu B}{r^2}\)`,
          String.raw`\(N_1/L=-4\pi\mu B\)`
        ],
        steps: [
          String.raw`En el regimen laminar base suponemos \(\vec v=v_\theta(r)\hat\theta\), sin \(v_r\) ni \(v_z\).`,
          String.raw`La ecuacion de cantidad de movimiento en \(\theta\) deja una ODE cuya solucion general es \(Ar+B/r\).`,
          String.raw`No deslizamiento: \(v_\theta(a)=\Omega_1a\) y \(v_\theta(b)=\Omega_2b\). Resolver ese sistema da \(A\) y \(B\).`,
          String.raw`La escena agrega bandas y celdas cuando el criterio de Rayleigh inviscido marca tendencia inestable; no reemplaza a una simulacion DNS.`
        ],
        build: buildP6TC,
        metrics: metricsP6TC,
        profile: profileP6TC
      },
      {
        id: "p7",
        short: "P7",
        title: "P7: esfera y arrastre dimensional",
        subtitle: "Comparacion entre escala viscosa e inercial alrededor de una esfera.",
        controls: [
          ["D", "diametro D", 0.15, 3.4, 0.02],
          ["U", "velocidad U", 0.02, 6, 0.02],
          ["mu", "viscosidad mu", 0.05, 5, 0.02],
          ["rho", "densidad fluido rho", 0.1, 5, 0.05],
          ["rhoS", "densidad esfera rho_s", 0.1, 10, 0.05],
          ["Cd", "Cd alto Re", 0.1, 1.2, 0.01],
          ["speed", "velocidad visual", 0, 2, 0.03]
        ],
        formula: [
          String.raw`\(Re=\rho UD/\mu\)`,
          String.raw`\(Re\ll1:\quad F_D=3\pi\mu D U\)`,
          String.raw`\(Re\gg1:\quad F_D\simeq\frac12C_D\rho U^2\frac{\pi D^2}{4}\)`,
          String.raw`\(U_{t,S}=\frac{(\rho_s-\rho)gD^2}{18\mu}\)`
        ],
        steps: [
          String.raw`Las variables \(U,D,\mu,\rho\) producen un numero adimensional dominante: \(Re=\rho UD/\mu\).`,
          String.raw`Si \(Re\ll1\), la inercia desaparece y la unica escala de fuerza es \(\mu U D\). Stokes fija el factor \(3\pi\).`,
          String.raw`Si \(Re\gg1\), manda la presion dinamica \(\rho U^2\) multiplicada por el area frontal.`,
          String.raw`Para velocidad terminal se iguala el peso efectivo de la esfera con la ley de arrastre del regimen correspondiente.`
        ],
        build: buildP7,
        metrics: metricsP7,
        profile: profileP7
      }
    ];

    modules.splice(2, 0, {
      id: "p3",
      short: "P3",
      title: "P3: pelicula de dos fluidos",
      subtitle: "Dos capas viscosas con continuidad de velocidad y esfuerzo.",
      controls: [
        ["theta", "angulo theta [deg]", 0, 70, 1],
        ["h1", "espesor inferior h1", 0.2, 1.8, 0.02],
        ["h2", "espesor superior h2", 0.2, 1.8, 0.02],
        ["mu1", "viscosidad mu1", 0.15, 5, 0.05],
        ["mu2", "viscosidad mu2", 0.15, 5, 0.05],

    function setupModules() {

          <span>

            <span class="module-sub">${m.subtitle}</span>
          </span>
        </button>
      `).join("");
      for (const btn of els.moduleList.querySelectorAll("button")) {
        btn.addEventListener("click", () => selectModule(btn.dataset.module));
      }
    }

    function setupEvents() {
      els.resetView.addEventListener("click", () => resetCamera(state.active));
      els.resetParams.addEventListener("click", () => {
        state.params[state.active] = structuredClone(defaults[state.active]);
        renderPanel();
        rebuildScene();
      });
      window.addEventListener("resize", resize);
      resize();
    }

    function readRequestedModule() {
      const requested = new URLSearchParams(location.search).get("module");
      return byId[requested] ? requested : "p1";
    }

    function selectModule(id) {
      state.active = id;
      state.time = 0;
      for (const btn of els.moduleList.querySelectorAll("button")) {
        btn.classList.toggle("active", btn.dataset.module === id);
      }
      const m = byId[id];
      els.title.textContent = m.title;
      els.subtitle.textContent = m.subtitle;
      renderPanel();
      resetCamera(id);
      rebuildScene();
      const url = new URL(location.href);
      url.searchParams.set("module", id);
      history.replaceState(null, "", url);
    }
